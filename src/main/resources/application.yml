server:
  port: 8080

spring:
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/meal_subsidy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:placeholder}
  redis:
    host: 127.0.0.1
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mealsubsidy.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:placeholder_jwt_key}
  expire-seconds: 86400
  header: Authorization
  prefix: "Bearer "

data-permission:
  enabled: true

# 生产环境设置为 false，关闭接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    enabled: ${knife4j.enable}
  api-docs:
    enabled: ${knife4j.enable}
  packages-to-scan: com.mealsubsidy.controller
